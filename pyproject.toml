[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astoria"
version = "0.1.0"
description = "Astoria — layered, trusted, scalable, deep memory for AI agents (Postgres+pgvector, REST+MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rick Mellor", email = "rickmellor@gmail.com" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "fastmcp>=2.3,<3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.9",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
astoria = "astoria.cli.main:app"

[tool.setuptools.packages.find]
include = ["astoria*"]

[tool.setuptools.package-data]
astoria = ["sql/*.sql", "cognify/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["llm: real LLM call (run with -m llm)", "slow: scale/benchmark tests"]
